<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>we are both obsolete</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<main class="hero">

  <!-- EVENT DETAILS -->
  <div class="event-detail">
    <div class="event-date">
      <span>4 February → 3 March</span>
      <span class="event-year">2026</span>
    </div>
    <div class="event-meta">
      <div>Malta Society of Arts</div>
      <div>Valletta</div>
    </div>
  </div>

  <!-- TITLE (SVG SYSTEM) -->
  <div class="hero-title-space">
    <div class="hero-title-svg">
      <img src="assets/we.svg" class="word small" alt="we">
      <img src="assets/are.svg" class="word small" alt="are">
      <img src="assets/both.svg" class="word large" alt="both">
      <img src="assets/obsolete.svg" class="word large" alt="obsolete">
    </div>
  </div>

  <!-- WHITE SLAB -->
  <div class="white-slab"></div>

  <!-- BIN WAVE -->
  <div class="bin-wave">
    <svg class="bin-wave-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="wave-mask" maskUnits="userSpaceOnUse">
          <rect id="mask-bg" fill="black" />
          <path id="wave-path" fill="white" />
        </mask>
      </defs>

      <rect id="white-region" fill="#FAFAFA" mask="url(#wave-mask)" />
      <g class="bins"></g>
    </svg>
  </div>

  <!-- CTA -->
  <div class="hero-cta">

    <div class="btn-wrap">
      <span class="btn-shadow"></span>
      <a class="btn btn-outline" href="cta.html">ENTER EXHIBITION</a>
    </div>

    <div class="btn-wrap">
      <span class="btn-shadow"></span>
      <a class="btn btn-green" href="Exhibition_Overview.html">ABOUT EXHIBITION</a>
    </div>

  </div>

</main>

<script src="wave.js"></script>
</body>
</html>
